<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="System architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E40AF"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B21B6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#065F46"/><stop offset="1" stop-color="#10B981"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="560" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">System Architecture</text>

    <rect x="40" y="75" width="1120" height="110" rx="18" fill="url(#a)"/>
    <text x="64" y="106" font-size="16" font-weight="700" fill="#BFDBFE" letter-spacing="2">FRONTEND  |  SINGLE-FILE WEB APP</text>
    <g font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">
      <rect x="64" y="122" width="190" height="42" rx="21" fill="#DBEAFE"/><text x="159" y="148">Drag-and-drop upload</text>
      <rect x="270" y="122" width="190" height="42" rx="21" fill="#DBEAFE"/><text x="365" y="148">Review and edit</text>
      <rect x="476" y="122" width="190" height="42" rx="21" fill="#DBEAFE"/><text x="571" y="148">Chart.js dashboards</text>
      <rect x="682" y="122" width="190" height="42" rx="21" fill="#DBEAFE"/><text x="777" y="148">SheetJS Excel export</text>
      <rect x="888" y="122" width="250" height="42" rx="21" fill="#DBEAFE"/><text x="1013" y="148">Responsive HTML, CSS, JS</text>
    </g>

    <g stroke="#475569" stroke-width="3" marker-end="url(#ar)">
      <line x1="400" y1="188" x2="400" y2="226"/><line x1="800" y1="226" x2="800" y2="190" marker-end="none" marker-start="url(#ar)"/>
    </g>
    <text x="414" y="212" font-size="13" fill="#475569">REST + CORS</text>
    <text x="814" y="212" font-size="13" fill="#475569">JSON response</text>

    <rect x="40" y="230" width="1120" height="170" rx="18" fill="url(#b)"/>
    <text x="64" y="261" font-size="16" font-weight="700" fill="#DDD6FE" letter-spacing="2">BACKEND  |  FASTAPI EXTRACTION AND SCORING ENGINE</text>
    <g font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">
      <rect x="64" y="280" width="250" height="100" rx="14" fill="#EDE9FE"/>
      <text x="189" y="308" font-weight="700" fill="#5B21B6">Ingest</text>
      <text x="189" y="332" font-weight="500">PDF: pdfplumber</text>
      <text x="189" y="352" font-weight="500">Excel: pandas, openpyxl</text>
      <text x="189" y="372" font-weight="500">Image: OCR</text>

      <rect x="334" y="280" width="250" height="100" rx="14" fill="#EDE9FE"/>
      <text x="459" y="308" font-weight="700" fill="#5B21B6">Understand</text>
      <text x="459" y="332" font-weight="500">Gemini Vision OCR</text>
      <text x="459" y="352" font-weight="500">LLM structured JSON</text>
      <text x="459" y="372" font-weight="500">Tesseract fallback</text>

      <rect x="604" y="280" width="250" height="100" rx="14" fill="#EDE9FE"/>
      <text x="729" y="308" font-weight="700" fill="#5B21B6">Validate</text>
      <text x="729" y="332" font-weight="500">Rule-based parser</text>
      <text x="729" y="352" font-weight="500">EBITDA post-calculation</text>
      <text x="729" y="372" font-weight="500">3-year spreading</text>

      <rect x="874" y="280" width="262" height="100" rx="14" fill="#EDE9FE"/>
      <text x="1005" y="308" font-weight="700" fill="#5B21B6">Decide</text>
      <text x="1005" y="332" font-weight="500">14 ratios and benchmarks</text>
      <text x="1005" y="352" font-weight="500">100-point scorecard</text>
      <text x="1005" y="372" font-weight="500">CIBIL band + decision tier</text>
    </g>
    <g stroke="#FFFFFF" stroke-width="3" marker-end="url(#ar)" opacity="0.8">
      <line x1="316" y1="330" x2="330" y2="330"/><line x1="586" y1="330" x2="600" y2="330"/><line x1="856" y1="330" x2="870" y2="330"/>
    </g>

    <rect x="40" y="430" width="1120" height="100" rx="18" fill="url(#c)"/>
    <text x="64" y="461" font-size="16" font-weight="700" fill="#A7F3D0" letter-spacing="2">OUTPUTS AND NEXT-STEP INTEGRATIONS</text>
    <g font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">
      <rect x="64" y="476" width="200" height="38" rx="19" fill="#D1FAE5"/><text x="164" y="500">Excel credit report</text>
      <rect x="280" y="476" width="200" height="38" rx="19" fill="#D1FAE5"/><text x="380" y="500">Analyst recommendation</text>
      <rect x="496" y="476" width="200" height="38" rx="19" fill="#ECFDF5" stroke="#10B981" stroke-dasharray="5 4"/><text x="596" y="500" fill="#065F46">CIBIL API (planned)</text>
      <rect x="712" y="476" width="200" height="38" rx="19" fill="#ECFDF5" stroke="#10B981" stroke-dasharray="5 4"/><text x="812" y="500" fill="#065F46">GSTN API (planned)</text>
      <rect x="928" y="476" width="210" height="38" rx="19" fill="#ECFDF5" stroke="#10B981" stroke-dasharray="5 4"/><text x="1033" y="500" fill="#065F46">Audit database (planned)</text>
    </g>
    <line x1="600" y1="402" x2="600" y2="426" stroke="#475569" stroke-width="3" marker-end="url(#ar)"/>
  </g>
