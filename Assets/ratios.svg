<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="14 financial ratios with benchmarks" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#1E40AF"/></linearGradient>
  </defs>
  <rect width="1200" height="640" rx="22" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect width="1200" height="96" rx="22" fill="url(#h)"/><rect y="60" width="1200" height="36" fill="url(#h)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="46" font-size="28" font-weight="800" fill="#FFFFFF">14 Ratios, Benchmarked Automatically</text>
    <text x="40" y="76" font-size="15" fill="#BFDBFE">Every ratio is checked against an industry range and flagged green, amber or red.</text>

    <g font-size="13" fill="#64748B">
      <text x="40" y="132" font-weight="700" fill="#1E40AF" letter-spacing="2">LIQUIDITY AND LEVERAGE</text>
    </g>
    <g>
      <rect x="40" y="144" width="270" height="92" rx="14" fill="#DBEAFE"/><text x="58" y="174" font-size="16" font-weight="700" fill="#1E3A8A">Current Ratio</text><text x="58" y="208" font-size="24" font-weight="800" fill="#1E40AF">1.20x - 1.50x</text><text x="58" y="226" font-size="12" fill="#475569">Current assets / liabilities</text>
      <rect x="330" y="144" width="270" height="92" rx="14" fill="#DBEAFE"/><text x="348" y="174" font-size="16" font-weight="700" fill="#1E3A8A">Quick Ratio</text><text x="348" y="208" font-size="24" font-weight="800" fill="#1E40AF">0.80x - 1.20x</text><text x="348" y="226" font-size="12" fill="#475569">Excludes inventory</text>
      <rect x="620" y="144" width="270" height="92" rx="14" fill="#DBEAFE"/><text x="638" y="174" font-size="16" font-weight="700" fill="#1E3A8A">Debt / Equity</text><text x="638" y="208" font-size="24" font-weight="800" fill="#1E40AF">1.50x - 2.00x</text><text x="638" y="226" font-size="12" fill="#475569">Leverage check</text>
      <rect x="910" y="144" width="250" height="92" rx="14" fill="#DBEAFE"/><text x="928" y="174" font-size="16" font-weight="700" fill="#1E3A8A">Interest Coverage</text><text x="928" y="208" font-size="24" font-weight="800" fill="#1E40AF">3.00x - 5.00x</text><text x="928" y="226" font-size="12" fill="#475569">EBITDA / interest</text>
    </g>

    <text x="40" y="270" font-size="13" font-weight="700" fill="#047857" letter-spacing="2">PROFITABILITY AND RETURNS</text>
    <g>
      <rect x="40" y="282" width="205" height="92" rx="14" fill="#D1FAE5"/><text x="56" y="312" font-size="15" font-weight="700" fill="#065F46">Net Margin</text><text x="56" y="346" font-size="21" font-weight="800" fill="#047857">5% - 10%</text><text x="56" y="364" font-size="12" fill="#475569">PAT / revenue</text>
      <rect x="260" y="282" width="205" height="92" rx="14" fill="#D1FAE5"/><text x="276" y="312" font-size="15" font-weight="700" fill="#065F46">EBITDA Margin</text><text x="276" y="346" font-size="21" font-weight="800" fill="#047857">12% - 15%</text><text x="276" y="364" font-size="12" fill="#475569">Operating strength</text>
      <rect x="480" y="282" width="205" height="92" rx="14" fill="#D1FAE5"/><text x="496" y="312" font-size="15" font-weight="700" fill="#065F46">OCF Margin</text><text x="496" y="346" font-size="21" font-weight="800" fill="#047857">8% - 12%</text><text x="496" y="364" font-size="12" fill="#475569">Cash quality</text>
      <rect x="700" y="282" width="205" height="92" rx="14" fill="#D1FAE5"/><text x="716" y="312" font-size="15" font-weight="700" fill="#065F46">ROE</text><text x="716" y="346" font-size="21" font-weight="800" fill="#047857">12% - 15%</text><text x="716" y="364" font-size="12" fill="#475569">Return on equity</text>
      <rect x="920" y="282" width="240" height="92" rx="14" fill="#D1FAE5"/><text x="936" y="312" font-size="15" font-weight="700" fill="#065F46">ROA</text><text x="936" y="346" font-size="21" font-weight="800" fill="#047857">5% - 10%</text><text x="936" y="364" font-size="12" fill="#475569">Return on assets</text>
    </g>

    <text x="40" y="408" font-size="13" font-weight="700" fill="#B45309" letter-spacing="2">GROWTH AND EFFICIENCY</text>
    <g>
      <rect x="40" y="420" width="270" height="92" rx="14" fill="#FEF3C7"/><text x="58" y="450" font-size="16" font-weight="700" fill="#92400E">Asset Turnover</text><text x="58" y="484" font-size="24" font-weight="800" fill="#B45309">1.00x - 1.50x</text><text x="58" y="502" font-size="12" fill="#475569">Revenue / total assets</text>
      <rect x="330" y="420" width="270" height="92" rx="14" fill="#FEF3C7"/><text x="348" y="450" font-size="16" font-weight="700" fill="#92400E">Revenue Growth</text><text x="348" y="484" font-size="24" font-weight="800" fill="#B45309">5% - 8%</text><text x="348" y="502" font-size="12" fill="#475569">Year on year</text>
    </g>

    <text x="640" y="408" font-size="13" font-weight="700" fill="#6D28D9" letter-spacing="2">REPAYMENT CAPACITY</text>
    <g>
      <rect x="620" y="420" width="180" height="92" rx="14" fill="#EDE9FE"/><text x="636" y="450" font-size="16" font-weight="700" fill="#5B21B6">DSCR</text><text x="636" y="484" font-size="21" font-weight="800" fill="#6D28D9">1.25x - 1.50x</text><text x="636" y="502" font-size="12" fill="#475569">Debt service cover</text>
      <rect x="815" y="420" width="170" height="92" rx="14" fill="#EDE9FE"/><text x="831" y="450" font-size="16" font-weight="700" fill="#5B21B6">FOIR</text><text x="831" y="484" font-size="21" font-weight="800" fill="#6D28D9">35% - 45%</text><text x="831" y="502" font-size="12" fill="#475569">Obligations / income</text>
      <rect x="1000" y="420" width="160" height="92" rx="14" fill="#EDE9FE"/><text x="1016" y="450" font-size="16" font-weight="700" fill="#5B21B6">PTI</text><text x="1016" y="484" font-size="21" font-weight="800" fill="#6D28D9">5% - 10%</text><text x="1016" y="502" font-size="12" fill="#475569">EMI / income</text>
    </g>

    <g transform="translate(40,552)">
      <rect width="1120" height="62" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="38" font-size="15" font-weight="700" fill="#0F172A">Status flags</text>
      <circle cx="170" cy="31" r="9" fill="#10B981"/><text x="188" y="37" font-size="15" fill="#334155">Within benchmark</text>
      <circle cx="360" cy="31" r="9" fill="#F59E0B"/><text x="378" y="37" font-size="15" fill="#334155">Borderline, review</text>
      <circle cx="560" cy="31" r="9" fill="#EF4444"/><text x="578" y="37" font-size="15" fill="#334155">Outside benchmark</text>
      <text x="1096" y="37" text-anchor="end" font-size="13" fill="#64748B">Benchmarks are general ranges, tune them per portfolio.</text>
    </g>
  </g>
</svg>
