<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Manual process versus the platform" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7F1D1D"/><stop offset="1" stop-color="#450A0A"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#065F46"/><stop offset="1" stop-color="#022C22"/></linearGradient>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#FCD34D"/></linearGradient>
  </defs>
  <rect width="1200" height="520" rx="22" fill="#0F172A"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="600" y="50" text-anchor="middle" font-size="28" font-weight="800" fill="#FFFFFF">The Credit Desk, Before and After</text>

    <rect x="40" y="80" width="520" height="400" rx="20" fill="url(#l)" stroke="#EF4444" stroke-width="2"/>
    <text x="70" y="124" font-size="22" font-weight="800" fill="#FCA5A5">BEFORE: manual spreading</text>
    <g font-size="17" fill="#FEE2E2">
      <text x="70" y="172">&#128193;  Open PDFs and scans one by one</text>
      <text x="70" y="214">&#9000;  Re-key numbers into Excel</text>
      <text x="70" y="256">&#129518;  Compute ratios by hand</text>
      <text x="70" y="298">&#128065;  Compare against benchmarks from memory</text>
      <text x="70" y="340">&#128221;  Write the credit note from scratch</text>
      <text x="70" y="382">&#9203;  Credit processing becomes the bottleneck</text>
    </g>
    <rect x="70" y="414" width="460" height="38" rx="19" fill="#450A0A" stroke="#EF4444"/>
    <text x="300" y="439" text-anchor="middle" font-size="16" font-weight="700" fill="#FCA5A5">Slow, error-prone, inconsistent</text>

    <g transform="translate(600,280)">
      <circle r="34" fill="url(#m)"/>
      <path d="M-12 -12L10 0L-12 12z" fill="#0F172A"/>
    </g>

    <rect x="640" y="80" width="520" height="400" rx="20" fill="url(#r)" stroke="#10B981" stroke-width="2"/>
    <text x="670" y="124" font-size="22" font-weight="800" fill="#6EE7B7">AFTER: AI Credit Intelligence</text>
    <g font-size="17" fill="#D1FAE5">
      <text x="670" y="172">&#9889;  Drag and drop the statements</text>
      <text x="670" y="214">&#129504;  OCR and AI extract 3 years of data</text>
      <text x="670" y="256">&#127919;  14 ratios computed instantly</text>
      <text x="670" y="298">&#128200;  Benchmarked and colour-flagged</text>
      <text x="670" y="340">&#128202;  100-point score with a clear tier</text>
      <text x="670" y="382">&#128229;  One-click Excel report for the note</text>
    </g>
    <rect x="670" y="414" width="460" height="38" rx="19" fill="#022C22" stroke="#10B981"/>
    <text x="900" y="439" text-anchor="middle" font-size="16" font-weight="700" fill="#6EE7B7">Fast, consistent, analyst stays in control</text>
  </g>
</svg>
